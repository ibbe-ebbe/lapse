<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lapse Search</title>
<style>
body{margin:0;background:#fff;color:#111;font:16px system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:22px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:20px monospace;text-transform:uppercase;padding:12px;border:1px solid #ddd;border-radius:12px}
button{font:inherit;border:0;border-radius:12px;padding:12px 20px;background:#111;color:#fff}
#out{margin-top:16px;padding:14px 16px;border:1px solid #eee;border-left:4px solid #111;border-radius:16px;display:none}
#id{font:600 22px monospace}
#st{color:#777}
</style>
</head>
<body>
<main>
<h1>Lapse Search</h1>
<div class="row">
  <input id="q" maxlength="7" placeholder="A123456">
  <button onclick="go()">Search</button>
</div>
<div id="out"><div id="id"></div><div id="st"></div></div>
</main>
<script>
// Published CSV link of your sheet tab (File > Share > Publish to web > CSV)
const CSV = "https://docs.google.com/spreadsheets/d/1n9g53Gs6vb_i5mU4XDMRuusjPHODDa8CSm_p8wMHOyE/gviz/tq?tqx=out:csv";
const ID_COL = 3;      // column D
const STATUS_COL = 5;  // column F (optional)

async function go() {
  const q = document.getElementById("q").value.trim().toUpperCase();
  const out = document.getElementById("out");
  out.style.display = "block";
  document.getElementById("id").textContent = q;
  document.getElementById("st").textContent = "Searching...";
  try {
    const text = await (await fetch(CSV)).text();
    const rows = text.trim().split(/\r?\n/).map(l => l.split(",").map(c => c.replace(/^"|"$/g, "").trim()));
    const hit = rows.find(r => (r[ID_COL] || "").toUpperCase() === q);
    document.getElementById("st").textContent = hit ? (hit[STATUS_COL] || "Found") : "Not found";
  } catch (e) {
    document.getElementById("st").textContent = "Error loading data";
  }
}
document.getElementById("q").onkeydown = e => { if (e.key === "Enter") go(); };
</script>
</body>
</html>
